<main class="page">
  <header class="hero">
    <p class="eyebrow">COM30 · Taller 08</p>
    <h1>Reserva de espacios</h1>
    <nav class="enlaces menu" aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Inicio</a
      >
      <a routerLink="/reservas" routerLinkActive="activo">Reservas</a>
      <a routerLink="/reservas/nueva" routerLinkActive="activo" ariaCurrentWhenActive="page"
        >Nueva reserva</a
      >
      <a routerLink="/estadisticas" routerLinkActive="activo" ariaCurrentWhenActive="page"
        >Estadísticas</a
      >
    </nav>
  </header>
  <router-outlet />
</main>
